name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax (ES modules)
        run: |
          set -e
          for f in *.js; do
            echo "checking $f"
            node --input-type=module --check < "$f"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python runtime compiles
        run: python3 -m py_compile runtime/*.py

      - name: No site-only dependencies leaked in
        run: |
          set -e
          if grep -rn "affiliate-tracking" --include=*.html --include=*.js .; then
            echo "affiliate tracking must not be part of this repository"; exit 1
          fi
          if grep -rn "ghp_[A-Za-z0-9]\{20,\}\|sk-[A-Za-z0-9]\{20,\}" --include=*.js --include=*.html .; then
            echo "looks like a credential in the tree"; exit 1
          fi

      - name: Origin markers are intact
        run: |
          set -e
          grep -q 'data-origin="https://qantcore.space/ai-engineer/"' index.html
          grep -q 'qantcore.space/ai-engineer' app.js
