<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Инженер — визуальная сборка агентской системы без кода · Qantcore</title>
<meta name="description" content="Соберите агентскую систему AI-инженера на интерактивных платах: каналы, контроль, оркестратор, ядро LLM, память и инструменты. Клик по детали — ввод API-ключа, замена и настройка. Без кода.">

<meta property="og:description" content="Интерактивные платы агентской системы: клик по детали — API-ключ, замена, настройка.">
<meta property="og:type" content="website">

<style>
:root{--accent:#ff9a3c;--bg:#e6e7e8;--panel:rgba(246,246,246,.94);--line:#c9cbce;--text:#33373c;--muted:#7e838a;--mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
body[data-theme=dark]{--bg:#121314;--panel:rgba(28,30,32,.94);--line:#3a3d41;--text:#dfe3e7;--muted:#8d939a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
a{color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block;transition:opacity .12s;cursor:grab;touch-action:none}
#stage canvas.fade{opacity:0}
.top{position:fixed;top:18px;left:22px;display:flex;align-items:center;gap:10px;letter-spacing:.14em;text-transform:uppercase;font-size:12px;z-index:3}
.top .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.top .home{color:var(--muted);text-decoration:none}
.top .home:hover{color:var(--text)}
#crumb a{color:var(--muted);text-decoration:none}#crumb a:hover{color:var(--text)}
#crumb b{font-weight:600;cursor:default}#projName{cursor:text!important;border-bottom:1px dashed transparent}#projName:hover{border-color:var(--muted)}
.tr{position:fixed;top:12px;right:16px;display:flex;gap:8px;align-items:center;z-index:3}
.pill{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
#dots button{width:12px;height:12px;border-radius:50%;border:0;background:var(--c);cursor:pointer;outline-offset:2px}
#dots button.on{outline:2px solid var(--c)}
.rb{font:inherit;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.rb.round{width:32px;height:32px;padding:0;border-radius:50%;letter-spacing:0}
.rb.on,.rb:hover{border-color:var(--accent)}
.side{position:fixed;top:62px;right:16px;width:186px;display:flex;flex-direction:column;gap:7px;z-index:3;max-height:calc(100vh - 140px);overflow-y:auto}
.pb,.ab{font:inherit;font-size:12.5px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left}
.pb span,.ab span{flex:1}
.pb i{font-style:normal;font-size:11px;color:var(--accent)}.pb i.ok{color:#2f9e6a}
kbd{font:inherit;font-size:11px;color:var(--muted)}
.pb:hover,.ab:hover{border-color:var(--accent)}
.pb.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.ab.on{background:var(--accent);color:#1d1f22;border-color:var(--accent)}
.sep{height:8px}
.info{position:fixed;left:22px;bottom:46px;width:min(420px,calc(100vw - 250px));background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;z-index:3;line-height:1.5}
.info h2{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:600}
.info p{font-size:12.5px}
.hint{position:fixed;left:22px;bottom:16px;color:var(--muted);font-size:11.5px;z-index:3;max-width:calc(100vw - 640px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stat{position:fixed;right:18px;bottom:16px;font-size:12px;z-index:3;text-align:right}
.made a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.made{position:fixed;right:18px;bottom:36px;font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;z-index:3}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:6px;transition:transform .25s;z-index:20;font-size:12.5px;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(10,12,14,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#modal.open{display:flex}
#mBody{width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.mh small{color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}
.mh h3{font-size:16px;margin-top:3px}
.x{font:inherit;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
.swap{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.swap>span{color:var(--muted);padding-top:6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#1d1f22}
.vd{color:var(--muted);margin:6px 0 12px;line-height:1.5}
.fields{display:grid;gap:10px}
.fld{display:grid;gap:4px}
.fld>span{font-size:11.5px;color:var(--muted)}
.fld em{color:var(--accent);font-style:normal;margin-left:2px}
.fld.key{background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:6px;padding:8px 10px}
input,textarea,select{font:inherit;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.sec{display:flex;gap:6px}.sec input{flex:1}
.eye{border:1px solid var(--line);background:transparent;border-radius:5px;cursor:pointer;padding:0 9px}
.note{font-size:11px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.ma{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}.ma span{flex:1}
.btn{font:inherit;font-size:12.5px;padding:8px 13px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1f22;font-weight:600}
.btn.danger{color:#d0473f}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card,.kind{font:inherit;text-align:left;display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--text);cursor:pointer}
.card:hover,.kind:hover{border-color:var(--accent)}
.card span,.kind small{color:var(--muted);font-size:11.5px;line-height:1.4}
.card small{color:var(--accent);font-size:11px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.search{margin-bottom:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:12px}.chk input{width:auto}
.plinks{display:grid;gap:8px;margin-top:12px;font-size:12px}
.plinks>a{color:var(--accent);text-decoration:none}.plinks>a:hover{text-decoration:underline}
.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow>span{color:var(--muted);font-size:11.5px;flex-basis:100%}
.prow>small{color:var(--muted);font-size:10.5px;flex-basis:100%;letter-spacing:.08em;text-transform:uppercase}
.pchip{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text);text-decoration:none}
.pchip:hover{border-color:var(--accent)}
.tcards{display:grid;gap:10px}
.tcard{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:6px}
.tcard.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tcard>b{font-size:13px}.tcard>b i{font-style:normal;color:var(--accent);font-size:11px;margin-left:6px}
.tcard>span{color:var(--muted);font-size:11.5px;line-height:1.45}
.tcard>small{color:var(--muted);font-size:11px}
.tcard .btn{justify-self:start}
.chead{font-size:20px;font-weight:700;margin-bottom:4px}
.chead a{color:var(--accent)}
.cf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.ctable{width:100%;border-collapse:collapse;margin-top:12px;font-size:11.5px}
.ctable th{color:var(--muted);text-align:left;font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
.ctable td{padding:6px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);vertical-align:top}
.crow.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.crow td small{color:var(--muted);font-size:10.5px}
.clink{color:var(--accent);text-decoration:none}
#run{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:30}
#run.open{display:flex}
#run .rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#run .rh b{font-size:13px}
#run .rh small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
#run .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
#runProb{padding:8px 14px;border-bottom:1px solid var(--line);display:none}
#runProb .btn{margin-left:8px;font-size:11px}
#runLog{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.msg{padding:8px 10px;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-width:92%}
.msg.u{align-self:flex-end;background:color-mix(in srgb,var(--accent) 15%,var(--panel));border:1px solid var(--line)}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.a.err{border-color:#e5484d;color:#e5484d}
.msg.appr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed var(--accent);font-size:11.5px}
.msg.appr .btn{font-size:11px;padding:4px 10px}
.msg.appr.ok{border-style:solid}
.msg.appr.no{border-color:#e5484d;border-style:solid}
.trace{font-size:10.5px;color:var(--muted)}
.trace summary{cursor:pointer}
.trows{margin-top:4px;border:1px solid var(--line);border-radius:4px}
.trow{display:grid;grid-template-columns:minmax(72px,auto) 1fr auto auto auto;gap:6px;padding:3px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);font-size:10px}
.trow>span:first-child{color:var(--muted);white-space:nowrap}
.trow>span:nth-child(2){min-width:0;overflow-wrap:anywhere}
.trow.bad{color:#e5484d}
.trow.tot{font-weight:700}
#runIn{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-end}
#runText{flex:1;resize:none;font:inherit;font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text)}
#runIn .btn{font-size:12px;padding:7px 12px}
@media(max-width:820px){#run{top:auto;width:100%;max-width:100%;height:60vh;border-left:0;border-top:1px solid var(--line)}}
#cx_text{width:100%;resize:vertical;font:inherit;font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ex{font-size:10.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer}
.ex:hover{color:var(--text);border-color:var(--accent)}
.cxgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cxb{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px}
.cxb>b{font-size:11.5px;color:var(--accent)}
.cxp{margin-top:3px}
.cxp small{color:var(--muted)}
.cxnotes{margin-top:8px;font-size:11px;color:#b7791f}
.ctop{display:flex;gap:8px;margin-bottom:10px}
.ctop textarea{flex:1;resize:none;font:inherit;font-size:12px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
@media(max-width:820px){#crumb{max-width:calc(100vw - 282px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
  .side{top:auto;bottom:0;left:0;right:0;width:auto;flex-direction:row;overflow-x:auto;padding:8px;background:var(--panel);border-top:1px solid var(--line);max-height:none}
  .pb,.ab{flex:none}.pb kbd,.ab kbd,.sep{display:none}
  .info{left:10px;right:10px;width:auto;bottom:62px;padding:10px 12px}.info p{font-size:11.5px}
  .hint,.made{display:none}#stat{bottom:auto;top:52px;left:12px;right:auto;text-align:left;font-size:10.5px;color:var(--muted)}
  .top{left:12px;top:14px;font-size:10.5px}.tr{right:10px}#dots{display:none}.pill:has(#dots){display:none}
  .cards,.kinds{grid-template-columns:1fr}
}
</style>
